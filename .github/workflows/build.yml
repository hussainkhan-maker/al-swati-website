name: Blog from the ERP
# Every 5 minutes (GitHub may run it a little later), on demand, and at once when the ERP asks after a Publish
# (that needs the GITHUB_SITE_TOKEN secret in Supabase; without it the 5-minute check picks the post up):
# builds the blog pages from the posts published in the AL-Swati ERP and saves them, so GitHub Pages serves them.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [erp-publish]
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/build.yml"]
permissions:
  contents: write
  pages: read
concurrency:
  group: build-blog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Square icon and share picture (when missing, or when tools/make-icons.py changed)
        run: |
          STAMP=$(sha256sum tools/make-icons.py | cut -c1-16)
          if [ ! -f favicon.ico ] || [ ! -f images/share/al-swati-contracting.jpg ] || [ ! -f apple-touch-icon.png ] || [ "$(cat images/icons/made-with.txt 2>/dev/null)" != "$STAMP" ]; then
            python3 -m pip install --quiet pillow && python3 tools/make-icons.py . && echo "$STAMP" > images/icons/made-with.txt
          fi
      - name: Pictures listed in tools/fetch-images.txt (downloaded once, then kept in the repository)
        run: |
          if [ -f tools/fetch-images.txt ] && [ -f tools/fetch-images.py ]; then python3 -m pip install --quiet pillow && python3 tools/fetch-images.py .; fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Blog pages from the ERP
        run: node tools/build-site.mjs .
        env:
          CHANGED_URLS: ${{ runner.temp }}/changed-urls.txt
      - name: Save
        run: |
          git config user.name "al-swati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Blog: posts from the ERP"
          git pull --rebase --quiet && git push
      - name: Tell search engines about new or changed pages (IndexNow, Google sitemap) and show it in the ERP
        env:
          CHANGED_URLS: ${{ runner.temp }}/changed-urls.txt
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$CHANGED_URLS" ] || exit 0
          # wait until GitHub Pages has really published this commit (at most about 10 minutes), so the search engines find the new pages
          SHA=$(git rev-parse HEAD); B=""
          for i in $(seq 1 40); do
            B=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status + " " + .commit' 2>/dev/null || true)
            [ "$B" = "built $SHA" ] && break
            # a newer commit (a later edit) built on top of ours also has our pages
            if [ "${B%% *}" = "built" ]; then git fetch -q --deepen=50 origin main 2>/dev/null || true; git merge-base --is-ancestor "$SHA" "${B#* }" 2>/dev/null && break; fi
            sleep 15
          done
          echo "GitHub Pages: $B"
          URLS=$(jq -R . "$CHANGED_URLS" | jq -s .)
          # The ERP pings IndexNow (Bing, Yandex and the others), resubmits the sitemap to Google Search Console and records both
          # for the badge in Growth. Same address and public key as the website's own forms (assets/main.js).
          ANON=$(grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' assets/main.js | head -1)
          OUT=$(curl -sS -m 120 -X POST https://keweaoogdnxietvyerhj.supabase.co/functions/v1/seo -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H 'content-type: application/json' -d "{\"action\":\"index_ping\",\"urls\":$URLS}" || true)
          echo "ERP: $OUT"
          case "$OUT" in *'"ok":true'*) exit 0 ;; esac
          # the ERP did not answer: tell IndexNow directly, so the new pages are still announced
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' \
            -d "{\"host\":\"al-swaticontracting.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://al-swaticontracting.com/$KEY.txt\",\"urlList\":$URLS}" -w ' IndexNow %{http_code}\n' || true
