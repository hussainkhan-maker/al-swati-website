name: Blog from the ERP
# Every 30 minutes (GitHub may run it a little later), on demand, and when the ERP asks after a Publish:
# builds the blog pages from the posts published in the AL-Swati ERP and saves them, so GitHub Pages serves them.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [erp-publish]
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/build.yml"]
permissions:
  contents: write
concurrency:
  group: build-blog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Square icon and share picture (only when missing)
        run: |
          if [ ! -f favicon.ico ] || [ ! -f images/share/al-swati-contracting.jpg ] || [ ! -f apple-touch-icon.png ]; then
            python3 -m pip install --quiet pillow && python3 tools/make-icons.py .
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Blog pages from the ERP
        run: node tools/build-site.mjs .
        env:
          CHANGED_URLS: ${{ runner.temp }}/changed-urls.txt
      - name: Save
        run: |
          git config user.name "al-swati-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Blog: posts from the ERP"
          git pull --rebase --quiet && git push
      - name: Tell Bing and other IndexNow search engines about new or changed posts
        env:
          CHANGED_URLS: ${{ runner.temp }}/changed-urls.txt
        run: |
          [ -s "$CHANGED_URLS" ] || exit 0
          sleep 60   # give GitHub Pages a minute to publish the new pages
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          URLS=$(jq -R . "$CHANGED_URLS" | jq -s .)
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' \
            -d "{\"host\":\"al-swaticontracting.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://al-swaticontracting.com/$KEY.txt\",\"urlList\":$URLS}" -w ' IndexNow %{http_code}\n' || true
