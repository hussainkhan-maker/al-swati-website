chor="start" class="ar" direction="rtl">مشبك تعليق (ألمنيوم) على المرساة، يدخل خطّافه في مجرى القطاع، وكل لوح معلّق وحده</text><circle cx="716" cy="808.0" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="716" y="812.0" font-size="11" font-weight="700" text-anchor="middle" class="en">7</text><text x="696" y="812.5" font-size="13.5" text-anchor="start" class="ar" direction="rtl">برغي ضبط في المشبك يرتكز على المجرى ويضبط منسوب اللوح</text><circle cx="716" cy="832.0" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="716" y="836.0" font-size="11" font-weight="700" text-anchor="middle" class="en">8</text><text x="696" y="836.5" font-size="13.5" text-anchor="start" class="ar" direction="rtl">لوح حجر أو بورسلان</text><circle cx="716" cy="856.0" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="716" y="860.0" font-size="11" font-weight="700" text-anchor="middle" class="en">9</text><text x="696" y="860.5" font-size="13.5" text-anchor="start" class="ar" direction="rtl">فراغ مهوّى، بدون مونة</text><circle cx="716" cy="880.0" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="716" y="884.0" font-size="11" font-weight="700" text-anchor="middle" class="en">10</text><text x="696" y="884.5" font-size="13.5" text-anchor="start" class="ar" direction="rtl">فاصل حسب المخططات التنفيذية</text><path d="M6 916 H754" stroke="#1a1a1a" stroke-width="1"/><text x="380.0" y="934" font-size="11" font-weight="700" text-anchor="middle" class="ar">تفصيلة نموذجية · للاسترشاد فقط · ليست للتنفيذ · AL-SWATI CONTRACTING</text></svg>