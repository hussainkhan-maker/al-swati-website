chor="middle" class="en">4</text><text x="64" y="870.7325581395348" font-size="13.5" text-anchor="start" class="en">Undercut anchor locked by shape in a hole in the BACK of the panel; the face stays whole</text><circle cx="44" cy="890.2325581395348" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="44" y="894.2325581395348" font-size="11" font-weight="700" text-anchor="middle" class="en">5</text><text x="64" y="894.7325581395348" font-size="13.5" text-anchor="start" class="en">Hanger on the anchor, hooked over the rail; each panel hangs on its own</text><circle cx="44" cy="914.2325581395348" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="44" y="918.2325581395348" font-size="11" font-weight="700" text-anchor="middle" class="en">6</text><text x="64" y="918.7325581395348" font-size="13.5" text-anchor="start" class="en">Stone panel, typically 30 mm</text><circle cx="44" cy="938.2325581395348" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="44" y="942.2325581395348" font-size="11" font-weight="700" text-anchor="middle" class="en">7</text><text x="64" y="942.7325581395348" font-size="13.5" text-anchor="start" class="en">Ventilated cavity, no mortar</text><circle cx="44" cy="962.2325581395348" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="1"/><text x="44" y="966.2325581395348" font-size="11" font-weight="700" text-anchor="middle" class="en">8</text><text x="64" y="966.7325581395348" font-size="13.5" text-anchor="start" class="en">Joint per the shop drawings</text><path d="M6 998.2 H754" stroke="#1a1a1a" stroke-width="1"/><text x="380.0" y="1016.2" font-size="11" font-weight="700" text-anchor="middle" class="en">TYPICAL DETAIL · FOR REFERENCE ONLY · NOT FOR CONSTRUCTION · AL-SWATI CONTRACTING</text></svg>